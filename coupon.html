<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우정사진 촬영권 쿠폰 | 이안스튜디오 율하</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff5f6;
    font-family: -apple-system, 'Apple SD Gothic Neo', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 24px 16px 48px;
  }
  .brand { text-align: center; margin-bottom: 20px; }
  .brand img { width: 56px; height: 56px; }
  .brand h1 { font-size: 18px; color: #4a3a3e; margin-top: 6px; font-weight: 600; }
  .coupon {
    width: 100%; max-width: 720px;
    background: #fff; border-radius: 20px;
    box-shadow: 0 12px 32px rgba(232, 114, 138, 0.18);
    overflow: hidden; margin-bottom: 24px;
  }
  .coupon img { width: 100%; height: auto; display: block; }
  .notice {
    background: #ffffff; border-radius: 16px; padding: 22px 24px;
    max-width: 720px; width: 100%;
    box-shadow: 0 6px 20px rgba(232, 114, 138, 0.10);
  }
  .notice h2 { font-size: 17px; color: #e8728a; margin-bottom: 12px; }
  .notice ol { padding-left: 20px; }
  .notice li { font-size: 15px; color: #4a3a3e; line-height: 1.9; }
  .notice .tip { margin-top: 14px; font-size: 14px; color: #b08a90; }
  @media (max-width: 480px) {
    .notice li { font-size: 14px; }
    .coupon img { border-radius: 12px; }
  }
</style>
</head>
<body>
  <div class="brand">
    <img src="images/logo.png" alt="이안스튜디오 로고">
    <h1>이안스튜디오 율하</h1>
  </div>

  <div class="coupon">
    <img src="images/coupon.png" alt="우정사진 촬영권 쿠폰">
  </div>

  <div class="notice">
    <h2>📱 쿠폰 저장 방법</h2>
    <ol>
      <li><b>이미지를 길게 누르세요</b> (꾹 눌러주세요!)</li>
      <li>나타나는 메뉴에서 <b>"이미지 저장"</b> 선택!</li>
      <li>스튜디오 방문 시 저장한 쿠폰을 보여주세요!</li>
    </ol>
    <p class="tip">💡 저장이 어려우시면 화면을 캡처해도 됩니다!</p>
  </div>
</body>
</html>
